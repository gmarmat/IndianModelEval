[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-models-eval"
version = "2026.03.18.01"
description = "Independent benchmark for Indian language translation models"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.40",
    "datasets>=2.19",
    "sacrebleu>=2.4",
    "unbabel-comet>=2.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "gradio>=4.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "sentencepiece>=0.2",
    "accelerate>=0.29",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pre-commit>=3.7",
    "detect-secrets>=1.4",
]

# NOTE: PyTorch with CUDA must be installed separately:
#   pip install torch --index-url https://download.pytorch.org/whl/cu121
#
# NOTE: IndicTrans2 requires IndicTransToolkit (formerly IndicTransTokenizer):
#   uv pip install indictranstoolkit
#
# NOTE: Indic-COMET (Phase 2) may require WSL2 on Windows.
#   Install in WSL2: pip install indic-comet

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[project.scripts]
ime-eval = "indian_models_eval.cli:app"
