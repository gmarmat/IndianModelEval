# IndianModelsEval — Model Registry
# Each entry defines a model's claimed capabilities, where to find it, and eval config.
# Add new models only after confirming local weights are available.
#
# FLORES-200 language codes: {lang}_{Script}  e.g. hin_Deva, eng_Latn, tam_Taml
# See src/indian_models_eval/config.py → FLORES_LANG_CODES for full list.

models:

  - id: indictrans2-en-indic
    display_name: "IndicTrans2 (En→Indic)"
    hf_id: "ai4bharat/indictrans2-en-indic-1B"
    local_path: "models/translation/indictrans2-en-indic-1B"
    type: seq2seq
    license: MIT
    direction: en_to_indic
    claimed_languages:
      src: [eng_Latn]
      tgt:
        - asm_Beng  # Assamese
        - ben_Beng  # Bengali
        - brx_Deva  # Bodo
        - doi_Deva  # Dogri
        - gom_Deva  # Konkani
        - guj_Gujr  # Gujarati
        - hin_Deva  # Hindi
        - kan_Knda  # Kannada
        - kas_Arab  # Kashmiri
        - mai_Deva  # Maithili
        - mal_Mlym  # Malayalam
        - mar_Deva  # Marathi
        - mni_Beng  # Manipuri
        - npi_Deva  # Nepali
        - ory_Orya  # Odia
        - pan_Guru  # Punjabi
        - san_Deva  # Sanskrit
        - sat_Olck  # Santhali
        - snd_Arab  # Sindhi
        - tam_Taml  # Tamil
        - tel_Telu  # Telugu
        - urd_Arab  # Urdu
    eval_config:
      batch_size: 64
      max_new_tokens: 256
      precision: fp16
      notes: "use_cache=False required — KV cache has None tensors incompatible with HF beam search"

  - id: indictrans2-indic-en
    display_name: "IndicTrans2 (Indic→En)"
    hf_id: "ai4bharat/indictrans2-indic-en-1B"
    local_path: "models/translation/indictrans2-indic-en-1B"
    type: seq2seq
    license: MIT
    direction: indic_to_en
    claimed_languages:
      tgt: [eng_Latn]
      src:
        - asm_Beng
        - ben_Beng
        - brx_Deva
        - doi_Deva
        - gom_Deva
        - guj_Gujr
        - hin_Deva
        - kan_Knda
        - kas_Arab
        - mai_Deva
        - mal_Mlym
        - mar_Deva
        - mni_Beng
        - npi_Deva
        - ory_Orya
        - pan_Guru
        - san_Deva
        - sat_Olck
        - snd_Arab
        - tam_Taml
        - tel_Telu
        - urd_Arab
    eval_config:
      batch_size: 64
      max_new_tokens: 256
      precision: fp16

  - id: sarvam-translate
    display_name: "Sarvam-Translate"
    hf_id: "sarvamai/sarvam-translate"
    local_path: "models/translation/sarvam-translate"
    type: seq2seq
    license: GPL-3.0
    direction: bidirectional
    isolation: subprocess  # REQUIRED — GPL-3.0 isolation
    claimed_languages:
      src: [eng_Latn, ben_Beng, guj_Gujr, hin_Deva, kan_Knda, mal_Mlym, mar_Deva, ory_Orya, pan_Guru, tam_Taml, tel_Telu]
      tgt: [eng_Latn, ben_Beng, guj_Gujr, hin_Deva, kan_Knda, mal_Mlym, mar_Deva, ory_Orya, pan_Guru, tam_Taml, tel_Telu]
    eval_config:
      batch_size: 8
      max_new_tokens: 256
      precision: fp16
      notes: "June 2025 release. GPL-3.0 — runner called via subprocess only."

  - id: nllb-200-distilled-600M
    display_name: "NLLB-200 (600M)"
    hf_id: "facebook/nllb-200-distilled-600M"
    local_path: "models/translation/nllb-200-distilled-600M"
    type: seq2seq
    license: CC-BY-NC-4.0
    direction: multilingual
    claimed_languages:
      src: [eng_Latn, asm_Beng, ben_Beng, guj_Gujr, hin_Deva, kan_Knda, mal_Mlym, mar_Deva, npi_Deva, ory_Orya, pan_Guru, tam_Taml, tel_Telu, urd_Arab]
      tgt: [eng_Latn, asm_Beng, ben_Beng, guj_Gujr, hin_Deva, kan_Knda, mal_Mlym, mar_Deva, npi_Deva, ory_Orya, pan_Guru, tam_Taml, tel_Telu, urd_Arab]
    eval_config:
      batch_size: 32
      max_new_tokens: 256
      precision: fp16
      notes: "CC-BY-NC-4.0 — non-commercial research only. NEVER use in commercial products."

  - id: gemma-3-4b-it
    display_name: "Gemma-3-4B-IT"
    hf_id: "google/gemma-3-4b-it"
    local_path: "models/translation/gemma-3-4b-it"
    type: decoder_only
    license: Gemma
    direction: bidirectional
    claimed_languages:
      # Gemma doesn't claim specific translation pairs — testing capability
      src: [eng_Latn, hin_Deva, ben_Beng, tam_Taml, tel_Telu]
      tgt: [eng_Latn, hin_Deva, ben_Beng, tam_Taml, tel_Telu]
    eval_config:
      batch_size: 4
      max_new_tokens: 512
      precision: fp16
      prompt_template: "Translate the following {src_lang} text to {tgt_lang}. Output only the translation, nothing else.\n\nText: {source}\n\nTranslation:"
      notes: "Decoder-only. Uses prompt-based translation. Higher batch memory usage."

  - id: krutrim-translate
    display_name: "Krutrim Translate"
    hf_id: "krutrim-ai-labs/KrutrimTranslate"
    local_path: "models/translation/krutrim-translate"
    type: seq2seq
    license: Krutrim-Community-v1.0
    direction: bidirectional
    claimed_languages:
      src: [eng_Latn, ben_Beng, hin_Deva, kan_Knda, mar_Deva, mal_Mlym, guj_Gujr, pan_Guru, tel_Telu, tam_Taml]
      tgt: [eng_Latn, ben_Beng, hin_Deva, kan_Knda, mar_Deva, mal_Mlym, guj_Gujr, pan_Guru, tel_Telu, tam_Taml]
    eval_config:
      batch_size: 32
      beam_len: 3
      notes: "CTranslate2 format. Two checkpoints: ct_model_english_indic + ct_model_indic_english. AIKosh/Krutrim — no independent eval exists."

# Models under investigation (not yet in registry):
# - krutrim-translate: API-only as of 2026-03, no local weights confirmed (open question in PRD)
